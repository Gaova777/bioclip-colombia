[project]
name = "bioclip-colombia"
version = "0.1.0"
description = "BioCLIP that knows when to say 'I'm not sure', tested on Colombian species"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioclip_co"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
